<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SHOW ME x NON-STOP — continuously play cool videos</title>
  <link rel="shortcut icon" href="/favicon.ico">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300"
        rel="stylesheet">

  <!-- Modern stylesheet -->
  <link href="stylesheets/application.css" rel="stylesheet">

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<script type="module" src="javascripts/player.js"></script>
<script type="module" src="javascripts/queue.js"></script>
<script type="module" src="javascripts/search.js"></script>
<body>

  <!-- Background image -->
  <div id="background"></div>

  <!-- Modern YouTube player -->
  <div id="player"></div>

  <!-- Search wrapper -->
  <div id="search_wrapper">
    <form id="search" onsubmit="submitSearch(); return false;" style="display:none;">
      <input id="query"
             type="text"
             value="slow motion"
             onclick="this.select()">
      <input id="submit" type="submit" value="Search">
    </form>
    <div class="clear"></div>
  </div>

  <!-- ShowMe button -->
  <div id="showme" onclick="toggleSearch(); return false;">
    <img src="images/showme.png" alt="ShowMe">
  </div>

  <!-- Optional VHX legacy block (hidden by CSS) -->
  <div id="vhx_logo">
    <div id="contact">
      <a href="mailto:jamie@vhx.tv?subject=showmenonstop.com">
        <img src="http://vhx.tv/images/mail_icon_fff.gif" alt="Email me" title="Email me">
      </a>
    </div>
    <div id="logo">
      <a href="http://vhx.tv" target="_blank">
        <img src="images/vhx_logo.png" alt="VHX.TV" title="VHX.TV">
      </a>
    </div>
  </div>

<!-- Modern player logic -->
<script>
  let player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: "",
      playerVars: {
        autoplay: 1,
        controls: 1,
        rel: 0,
        modestbranding: 1
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange
      }
    });
  }

  function onPlayerReady(event) {
    if (window.queue && typeof window.queue.onPlayerReady === "function") {
      window.queue.onPlayerReady(player);
    }
  }

  function onPlayerStateChange(event) {
    if (window.queue && typeof window.queue.onPlayerStateChange === "function") {
      window.queue.onPlayerStateChange(player, event.data);
    }
  }

  function submitSearch() {
    import('/javascripts/search.js').then(module => {
      module.submitSearchFromUI();
    });
  }

  function toggleSearch() {
    const form = document.getElementById("search");
    form.style.display = (form.style.display === "none") ? "block" : "none";
  }
</script>

</body>
</html>
